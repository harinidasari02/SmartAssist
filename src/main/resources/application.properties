# Secrets come from environment variables. Nothing sensitive is stored in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartassist?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080

app.ai.system-prompt=You are SmartAssist, a helpful and concise assistant.

# Local model served by Ollama
app.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:llama3.2}

# Grok (xAI API). Leave GROK_API_KEY empty to disable it.
app.grok.url=${GROK_URL:https://api.x.ai/v1}
app.grok.api-key=${GROK_API_KEY:}
app.grok.model=${GROK_MODEL:grok-4}
